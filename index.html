<body>
  <div id="__bundler_placeholder">Loading Ôn trắc nghiệm...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>

    document.addEventListener('DOMContentLoaded', async function () {
      const loading = document.getElementById('__bundler_loading');
      function setStatus(msg) { if (loading) loading.textContent = msg; }

      const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
      const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
      function toBase64(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(bin);
      }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error', function (e) {
        // Failed resource loads (CSP-blocked links, scripts, images) fire plain
        // events at the element — warn only; real JS errors carry message/error.
        if (!e.message && !e.error && e.target && e.target !== window) {
          console.warn('[bundle] resource failed to load:',
            e.target.tagName, String(e.target.src || e.target.href || ''));
          return;
        }
        var p = document.body || document.documentElement;
        var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
        d.id = '__bundler_err';
        d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
          '[bundle] ' + (e.message || e.type) +
          (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
      }, true);

      try {
        const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
        const templateEl = document.querySelector('script[type="__bundler/template"]');
        if (!manifestEl || !templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
          return;
        }

        const manifest = JSON.parse(manifestEl.textContent);
        let template = JSON.parse(templateEl.textContent);

        // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
        // document's manifest; frame srcs carry an about:blank#<uuid> marker
        // instead of a substitutable uuid. Every document mints the blobs for
        // its OWN frames — from local text at the root, or text obtained from
        // its DIRECT parent over the relay protocol below — so each frame
        // navigation stays same-origin with its initiator and a deduped page
        // loads at any depth on any host, including a file:// download's
        // opaque origins (where a blob minted by one document cannot be
        // navigated to by another).
        const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
        const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
        const pageSet = new Set(pageOrder);
        const pageTexts = {};

        // ── Nested-page text protocol (parent-chain relay) ──
        // Page bundles ship once, in the ROOT document's manifest. Every
        // document mints the blobs for its OWN frames, obtaining page text
        // through a strict parent-chain relay: a document only ever SENDS to
        // its direct parent (which, for every document the publisher's own
        // runtime minted, is another publisher document) and only ACCEPTS
        // text from that direct parent; requests from below are honored only
        // for the document's own child frames, and the ROOT never sends
        // upward at all. That last rule is load-bearing: the artifact host's
        // frame-ancestors allows claude.ai (and friends) to frame an
        // artifact, so window.top can be a FOREIGN document — a top-addressed
        // protocol would hand page uuids to that ancestor and accept forged
        // "page text" from it, minting attacker HTML as an artifact-origin
        // blob document. The chain never touches the ancestor: requests stop
        // at the root, replies are origin-addressed per hop (never '*' when
        // an origin exists), and both directions are origin-gated (on https
        // a foreign sender's origin can never equal this document's; in
        // opaque contexts — file:// — everything serializes as 'null', where
        // an embedded EXTERNAL frame still fails the gate by carrying its
        // own real origin, and a sandboxed child of such a frame is excluded
        // by the own-child-frames check plus uuid unguessability). Shape is
        // deny-by-default: one request form, one reply form, no error
        // replies.
        // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
        // contexts such as a sandboxed preview iframe) — location.origin is
        // computed from the URL and stays 'https://…' even when the document
        // is sandboxed, which would misgate every opaque chain.
        const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
          ? window.origin
          : '*';
        function trustedOrigin(e) {
          if (e.origin === window.origin) return true; // https chains; opaque==opaque
          // file:// trees: Chrome serializes the file document's origin as
          // 'file://' while the blob: documents it mints serialize as 'null',
          // so the two legitimate shapes can never string-match — accept the
          // pair in both directions. https origins never serialize as either,
          // and sender identity (own child frame / direct parent) is checked
          // separately.
          return (
            (e.origin === 'null' &&
              (window.origin === 'file://' ||
                window.location.protocol === 'file:')) ||
            (/^file:/.test(e.origin) && window.origin === 'null')
          );
        }
        // Non-empty only in the root document (nested bundles ship an empty
        // island), so it doubles as the root marker: the root answers from
        // local text and treats a miss as authoritative — never relaying to
        // its (possibly foreign) parent.
        const isPageRoot = pageOrder.length > 0;
        const blobUrls = {};
        const resourceBlobs = {};
        const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
        const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
        const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
        function mountPage(el, frag, text) {
          const pageBlob = new Blob([text], { type: 'text/html' });
          const u = URL.createObjectURL(pageBlob);
          resourceBlobs[u] = pageBlob;
          el.src = u + frag;
        }
        function deliverPage(uuid, text) {
          const frames = pendingFrames[uuid];
          delete pendingFrames[uuid];
          if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
          const relays = pendingRelays[uuid];
          delete pendingRelays[uuid];
          if (relays) {
            for (const cw of relays) {
              try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
            }
          }
        }
        function ownFrameWindows() {
          const out = [];
          for (const f of Array.from(document.querySelectorAll('iframe'))) {
            try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
          }
          return out;
        }
        window.addEventListener('message', function (e) {
          const d = e.data;
          if (!d || typeof d !== 'object' || !e.source) return;
          // Origin gate first; the structural checks below (own-child-frames
          // for requests, direct-parent + solicited-uuid for replies, the
          // root's never-relay rule) are what hold in fully opaque chains
          // where origin strings can't discriminate — a sandboxed root's
          // FOREIGN wrapper still fails all three even though both serialize
          // as real-vs-'null' rather than matching.
          if (!trustedOrigin(e)) return;
          if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
            // Requests are honored only for this document's own child frames.
            if (ownFrameWindows().indexOf(e.source) < 0) return;
            const uuid = d.__bundler_need;
            const text = pageTexts[uuid];
            if (typeof text === 'string') {
              try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
              return;
            }
            if (isPageRoot || window.parent === window) return; // authoritative miss
            const waiting = pendingRelays[uuid];
            if (waiting) {
              if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
              return;
            }
            // Never-answered uuids would otherwise accumulate forever under a
            // request spray; past the cap (far above any real page count) new
            // relays are dropped rather than remembered.
            if (Object.keys(pendingRelays).length >= 128) return;
            pendingRelays[uuid] = [e.source];
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          } else if (
            typeof d.__bundler_page === 'string' &&
            UUID_SHAPE.test(d.__bundler_page) &&
            typeof d.__bundler_text === 'string'
          ) {
            // The shape test is load-bearing beyond tidiness: the solicited
            // check below uses the in operator, which matches prototype keys
            // ('__proto__', 'constructor') — an unshaped key would reach
            // deliverPage and throw, painting the error banner.
            // Text is accepted only from the direct parent — the document
            // that minted this one.
            if (e.source !== window.parent || window.parent === window) return;
            if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
            deliverPage(d.__bundler_page, d.__bundler_text);
          }
        });

        const uuids = Object.keys(manifest);
        setStatus('Unpacking ' + uuids.length + ' assets...');

        await Promise.all(uuids.map(async (uuid) => {
          const entry = manifest[uuid];
          try {
            const binaryStr = atob(entry.data);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            let finalBytes = bytes;
            if (entry.compressed) {
              if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                const reader = ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks = [];
                let totalLen = 0;
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  totalLen += value.length;
                }
                finalBytes = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
              } else {
                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
              }
            }

            if (pageSet.has(uuid)) {
              pageTexts[uuid] = new TextDecoder().decode(finalBytes);
              return;
            }
            if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
              // Strict artifact hosts allow font-src data: but not blob:.
              blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
                (entry.compressed ? toBase64(finalBytes) : entry.data);
            } else {
              const blob = new Blob([finalBytes], { type: entry.mime });
              blobUrls[uuid] = URL.createObjectURL(blob);
              resourceBlobs[blobUrls[uuid]] = blob;
            }
          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            const blob = new Blob([], { type: entry.mime });
            blobUrls[uuid] = URL.createObjectURL(blob);
            resourceBlobs[blobUrls[uuid]] = blob;
          }
        }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
        // consumers read these Blobs directly. Survives the swap like the error sink.
        window.__resourceBlobs = resourceBlobs;

        setStatus('Rendering...');
        // Page uuids have no blob here — they ride inside about:blank#<uuid>
        // frame markers the pass below resolves after the swap.
        for (const uuid of uuids) {
          if (pageSet.has(uuid)) continue;
          template = template.split(uuid).join(blobUrls[uuid]);
        }

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
        // bundler left live-fetched (an absolute x-import, a runtime dependency it
        // could not embed, an authored external script) keeps the pin it was
        // written with: that fetch is exactly what SRI protects. (A crossorigin
        // on a parent whose child carries the blob — <video crossorigin><source>
        // — is left alone too; the attribute is then the author's to drop.)
        template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);

        // Resolve page-frame markers: mint this document's own blob for each
        // framed page — from local text when this is the root, otherwise by
        // asking the direct parent over the relay protocol above. An
        // unanswered request leaves the frame on about:blank, the same
        // degraded state as a refused embed.
        {
          const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
          const needed = [];
          for (const el of Array.from(document.querySelectorAll('iframe'))) {
            const m = MARKER.exec(el.getAttribute('src') || '');
            if (!m) continue;
            const text = pageTexts[m[1]];
            if (typeof text === 'string') {
              mountPage(el, m[2] || '', text);
            } else if (window.parent !== window && !isPageRoot) {
              const had = pendingFrames[m[1]];
              (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
              if (!had) needed.push(m[1]);
            }
          }
          for (const uuid of needed) {
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          }
        }

        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: read and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const pre = resourceBlobs[s.src.split('#')[0]];
            s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

play: flex; flex-direction: column; gap: 28px\">\n  <div style=\"display: flex; flex-direction: column; gap: 8px\">\n    <h1 style=\"margin: 0; font-size: 34px; line-height: 1.2; font-weight: 700\">Ôn trắc nghiệm ngẫu nhiên<\u002Fh1>\n    <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #3E4F5C\">Chọn môn, chọn chương, chọn số câu. Hệ thống bốc ngẫu nhiên từ ngân hàng đề của bạn.<\u002Fp>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ bankMissing }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"margin: 0; padding: 14px 16px; border-radius: 12px; background: #FBE6E4; border: 1px solid #B3261E; color: #7A1712; font-size: 15px\">Không tải được ngân hàng câu hỏi. Hãy tải lại trang.<\u002Fp>\n  <\u002Fsc-if>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">1. Chọn môn<\u002Fh2>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n      <sc-for list=\"{{ subjects }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ s.toggle }}\" aria-pressed=\"{{ s.on }}\" style=\"flex: 1 1 230px; min-height: 84px; box-sizing: border-box; text-align: left; padding: 14px 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; background: {{ s.bg }}; border: 2px solid {{ s.bd }}; color: {{ s.fg }}\">\n          <span style=\"font-size: 16px; font-weight: 600\">{{ s.name }}<\u002Fspan>\n          <span style=\"font-size: 14px; color: {{ s.sub }}\">{{ s.countText }} · {{ s.hint }}<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; color: {{ s.sub }}\">{{ s.state }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasChapGroups }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display: flex; flex-direction: column; gap: 16px\">\n    <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">2. Chọn chương<\u002Fh2>\n    <sc-for list=\"{{ chapGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n      <div style=\"background: #FFFFFF; border: 1px solid #D3DBE1; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n          <span style=\"font-size: 15px; font-weight: 700\">{{ g.name }}<\u002Fspan>\n          <span style=\"display: flex; gap: 8px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ g.all }}\" style=\"min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; background: #FFFFFF; border: 1px solid #B8C4CD; color: #14212B\">Chọn hết<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ g.none }}\" style=\"min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; background: #FFFFFF; border: 1px solid #B8C4CD; color: #14212B\">Bỏ hết<\u002Fbutton>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <sc-for list=\"{{ g.chaps }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.toggle }}\" aria-pressed=\"{{ c.on }}\" style=\"min-height: 44px; padding: 6px 14px; border-radius: 10px; text-align: left; font-size: 14px; line-height: 1.35; font-weight: 500; background: {{ c.bg }}; border: 2px solid {{ c.bd }}; color: {{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">{{ countHeading }}<\u002Fh2>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n      <sc-for list=\"{{ counts }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" aria-pressed=\"{{ c.on }}\" style=\"min-width: 88px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 600; background: {{ c.bg }}; border: 2px solid {{ c.bd }}; color: {{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ toggleShuffle }}\" aria-pressed=\"{{ shuffleOn }}\" style=\"align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #FFFFFF; border: 2px solid #B8C4CD; color: #14212B\">{{ shuffleLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: flex-start\">\n    <p style=\"margin: 0; font-size: 15px; color: #3E4F5C\">{{ summary }}<\u002Fp>\n    <button type=\"button\" sc-camel-on-click=\"{{ start }}\" style=\"min-height: 52px; padding: 0 28px; border-radius: 12px; border: 0; font-size: 17px; font-weight: 700; background: {{ startBg }}; color: {{ startFg }}\">Bắt đầu ôn<\u002Fbutton>\n  <\u002Fdiv>\n\n  <p style=\"margin: 0; padding-top: 16px; border-top: 1px solid #D3DBE1; font-size: 14px; line-height: 1.5; color: #4A5B68\">{{ footNote }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== QUIZ ===================== -->\n<sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ quit }}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 10px; font-size: 15px; font-weight: 600; background: #FFFFFF; border: 1px solid #B8C4CD; color: #14212B\">Thoát<\u002Fbutton>\n    <div style=\"display: flex; gap: 16px; align-items: center; font-size: 15px; font-weight: 600; color: #3E4F5C\">\n      <span>Câu {{ quiz.num }}/{{ quiz.total }}<\u002Fspan>\n      <span>Đúng: {{ quiz.right }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 8px; border-radius: 999px; background: #D3DBE1; overflow: hidden\">\n    <div style=\"height: 8px; background: #0F5F8C; width: {{ quiz.progress }}\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background: #FFFFFF; border: 1px solid #D3DBE1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n      <span style=\"font-size: 13px; font-weight: 700; color: #0B4E73; background: #E1EFF6; border-radius: 999px; padding: 4px 12px\">{{ quiz.subject }}<\u002Fspan>\n      <span style=\"font-size: 13px; font-weight: 500; color: #4A5B68\">{{ quiz.where }}<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"margin: 0; font-size: 20px; line-height: 1.5; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere\">{{ quiz.question }}<\u002Fh2>\n\n    <sc-if value=\"{{ quiz.hasCode }}\" hint-placeholder-val=\"{{ false }}\">\n      <pre style=\"margin: 0; padding: 14px 16px; border-radius: 10px; background: #EEF2F5; border: 1px solid #D3DBE1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.5; color: #14212B; overflow-x: auto; tab-size: 4\">{{ quiz.code }}<\u002Fpre>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ quiz.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n      <img src=\"{{ quiz.img }}\" alt=\"Hình minh họa của câu hỏi\" style=\"max-width: 100%; height: auto; align-self: flex-start; border: 1px solid #D3DBE1; border-radius: 8px; background: #FFFFFF\">\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ quiz.showMultiHint }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin: 0; font-size: 14px; font-weight: 600; color: #0B4E73\">{{ quiz.multiHint }}<\u002Fp>\n    <\u002Fsc-if>\n\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <sc-for list=\"{{ quiz.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.selected }}\" style=\"width: 100%; box-sizing: border-box; min-height: 56px; text-align: left; padding: 12px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center; font-size: 16px; line-height: 1.45; background: {{ o.bg }}; border: 2px solid {{ o.bd }}; color: {{ o.fg }}\">\n          <span style=\"flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: {{ o.badgeBg }}; color: {{ o.badgeFg }}\">{{ o.letter }}<\u002Fspan>\n          <span style=\"flex: 1 1 auto; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere\">{{ o.text }}<\u002Fspan>\n          <sc-if value=\"{{ o.hasTag }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"flex: 0 0 auto; font-size: 13px; font-weight: 700\">{{ o.tag }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ quiz.showCheck }}\" hint-placeholder-val=\"{{ false }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ check }}\" style=\"align-self: flex-start; min-height: 52px; padding: 0 28px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 700; background: {{ quiz.checkBg }}; color: {{ quiz.checkFg }}\">Kiểm tra đáp án<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ quiz.answered }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: {{ quiz.fbBg }}; border: 1px solid {{ quiz.fbBd }}; color: {{ quiz.fbFg }}\">\n        <span style=\"font-size: 16px; font-weight: 700\">{{ quiz.verdict }}<\u002Fspan>\n        <sc-if value=\"{{ quiz.hasExplain }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 15px; line-height: 1.5\">{{ quiz.explain }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ quiz.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; background: #FFF4D6; border: 1px solid #A35F00; color: #4D2C00\">\n          <span style=\"font-size: 14px; font-weight: 700\">Lưu ý về câu này<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.5\">{{ quiz.note }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"align-self: flex-start; min-height: 52px; padding: 0 28px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 700; background: #0F5F8C; color: #FFFFFF\">{{ quiz.nextLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== RESULT ===================== -->\n<sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n  <div style=\"background: #FFFFFF; border: 1px solid #D3DBE1; border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px\">\n    <span style=\"font-size: 15px; font-weight: 600; color: #3E4F5C\">Kết quả lượt ôn<\u002Fspan>\n    <div style=\"display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n      <span style=\"font-size: 56px; line-height: 1; font-weight: 700\">{{ result.score }}/{{ result.total }}<\u002Fspan>\n      <span style=\"font-size: 24px; font-weight: 600; color: #0B4E73\">{{ result.pct }}%<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-size: 16px; color: #14212B\">{{ result.verdict }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Theo từng môn<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <sc-for list=\"{{ result.bySub }}\" as=\"b\" hint-placeholder-count=\"3\">\n        <div style=\"background: #FFFFFF; border: 1px solid #D3DBE1; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600\">\n            <span>{{ b.name }}<\u002Fspan>\n            <span>{{ b.right }}/{{ b.total }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height: 8px; border-radius: 999px; background: #D3DBE1; overflow: hidden\">\n            <div style=\"height: 8px; background: #0F5F8C; width: {{ b.w }}\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n    <sc-if value=\"{{ result.hasWrong }}\" hint-placeholder-val=\"{{ true }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ retryWrong }}\" style=\"min-height: 52px; padding: 0 24px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 700; background: #0F5F8C; color: #FFFFFF\">Làm lại {{ result.wrongCount }} câu sai<\u002Fbutton>\n    <\u002Fsc-if>\n    <button type=\"button\" sc-camel-on-click=\"{{ again }}\" style=\"min-height: 52px; padding: 0 24px; border-radius: 12px; font-size: 16px; font-weight: 700; background: #FFFFFF; border: 2px solid #0F5F8C; color: #0B4E73\">Bốc đề mới<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ quit }}\" style=\"min-height: 52px; padding: 0 24px; border-radius: 12px; font-size: 16px; font-weight: 600; background: #FFFFFF; border: 1px solid #B8C4CD; color: #14212B\">Đổi môn / chương / số câu<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ result.hasWrong }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Các câu cần xem lại<\u002Fh2>\n    <sc-for list=\"{{ result.wrongs }}\" as=\"w\" hint-placeholder-count=\"2\">\n      <div style=\"background: #FFFFFF; border: 1px solid #D3DBE1; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-size: 13px; font-weight: 700; color: #0B4E73\">{{ w.where }}<\u002Fspan>\n        <span style=\"font-size: 16px; line-height: 1.45; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere\">{{ w.question }}<\u002Fspan>\n        <sc-if value=\"{{ w.hasCode }}\" hint-placeholder-val=\"{{ false }}\">\n          <pre style=\"margin: 0; padding: 12px 14px; border-radius: 10px; background: #EEF2F5; border: 1px solid #D3DBE1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; overflow-x: auto; tab-size: 4\">{{ w.code }}<\u002Fpre>\n        <\u002Fsc-if>\n        <span style=\"font-size: 15px; line-height: 1.45; color: #7A1712; white-space: pre-wrap; overflow-wrap: anywhere\"><b>Bạn chọn:<\u002Fb> {{ w.yours }}<\u002Fspan>\n        <span style=\"font-size: 15px; line-height: 1.45; color: #124D2C; white-space: pre-wrap; overflow-wrap: anywhere\"><b>Đáp án đúng:<\u002Fb> {{ w.right }}<\u002Fspan>\n        <sc-if value=\"{{ w.hasExplain }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 15px; line-height: 1.5; color: #3E4F5C\">{{ w.explain }}<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ w.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 14px; line-height: 1.5; color: #4D2C00; background: #FFF4D6; border-radius: 8px; padding: 8px 12px\"><b>Lưu ý:<\u002Fb> {{ w.note }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n\n  bank() { return Array.isArray(window.QBANK) ? window.QBANK : []; }\n\n  chapNames() { return window.QCHAPS || {}; }\n\n  subjectList() {\n    return [\n      { id: 'net', name: 'Mạng máy tính', src: 'từ file ngân hàng đề' },\n      { id: 'linux', name: 'Hệ điều hành Linux', src: 'từ file ngân hàng đề' },\n      { id: 'oop', name: 'Lập trình hướng đối tượng', src: 'từ file ngân hàng đề' },\n      { id: 'sql', name: 'SQL Server', src: 'soạn từ ghi chú' },\n      { id: 'py', name: 'Python', src: 'soạn từ ghi chú' }\n    ];\n  }\n\n  shuffle(a) {\n    const x = a.slice();\n    for (let i = x.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      const t = x[i]; x[i] = x[j]; x[j] = t;\n    }\n    return x;\n  }\n\n  // Câu có đáp án kiểu \"Cả 3 ý trên\", \"A và B đều đúng\"... thì giữ nguyên thứ tự.\n  keepOrder(d) {\n    const re1 = /(cả|tất cả|đều đúng|đều sai|ý trên|trên đều|đáp án (nào|trên)|phương án|không có|all of|none of|both|above)/i;\n    const re2 = /\\b[A-E]\\s*(,|và|&)\\s*[A-E]\\b/;\n    for (let i = 0; i < d.o.length; i++) {\n      if (re1.test(d.o[i]) || re2.test(d.o[i])) return true;\n    }\n    return false;\n  }\n\n  // Đáp án có nhắc tới chữ cái (vd: \"A và B đều đúng\") thì không được đổi vị trí.\n  letterRef(d) {\n    const re2 = /\\b[A-E]\\s*(,|và|&)\\s*[A-E]\\b/;\n    return d.o.some((o) => re2.test(o));\n  }\n\n  build(items, doShuffle) {\n    return items.map((d) => {\n      const idx = d.o.map((x, i) => i);\n      let ord = idx;\n      if (doShuffle) {\n        ord = this.keepOrder(d) ? idx : this.shuffle(idx);\n      } else if (!this.letterRef(d)) {\n        // Tắt xáo trộn: đẩy đáp án đúng lên đầu (câu A) để dễ học.\n        ord = d.a.concat(idx.filter((i) => d.a.indexOf(i) < 0));\n      }\n      return { d: d, ord: ord };\n    });\n  }\n\n  isMulti(d) { return d.a.length > 1; }\n\n  grade(d, picks) {\n    if (this.isMulti(d)) {\n      return picks.length === d.a.length && picks.every((p) => d.a.indexOf(p) >= 0);\n    }\n    const p = picks[0];\n    return d.a.indexOf(p) >= 0 || (d.l || []).indexOf(p) >= 0;\n  }\n\n  st() {\n    return Object.assign({\n      screen: 'setup',\n      sel: { net: true, linux: true, oop: true, sql: true, py: true },\n      chapOff: {},\n      count: 20,\n      shuf: true,\n      qs: [],\n      idx: 0,\n      picks: [],\n      checked: false,\n      log: []\n    }, this.state || {});\n  }\n\n  subName(id) {\n    const f = this.subjectList().filter((s) => s.id === id)[0];\n    return f ? f.name : id;\n  }\n\n  chapLabel(d) {\n    const cn = this.chapNames()[d.s] || {};\n    if (Object.keys(cn).length < 2) return '';\n    return 'Chương ' + d.cn + ': ' + (cn[d.cn] || '');\n  }\n\n  whereLabel(d) {\n    const ch = this.chapLabel(d);\n    return (ch ? ch + ' · ' : '') + 'Câu ' + d.i;\n  }\n\n  pool(s) {\n    return this.bank().filter((d) => s.sel[d.s] && !s.chapOff[d.s + ':' + d.cn]);\n  }\n\n  begin(items) {\n    const s = this.st();\n    this.setState({ screen: 'quiz', qs: this.build(items, s.shuf), idx: 0, picks: [], checked: false, log: [] });\n  }\n\n  renderVals() {\n    const s = this.st();\n    const bank = this.bank();\n    const subs = this.subjectList();\n    const names = this.chapNames();\n    const selected = subs.filter((x) => s.sel[x.id]);\n    const avail = this.pool(s);\n    const n = Math.min(s.count, avail.length);\n\n    // ----- setup -----\n    const subjects = subs.map((x) => {\n      const on = !!s.sel[x.id];\n      return {\n        name: x.name,\n        hint: x.src,\n        countText: bank.filter((d) => d.s === x.id).length + ' câu',\n        on: on,\n        state: on ? 'Đã chọn' : 'Chưa chọn',\n        bg: on ? '#E1EFF6' : '#FFFFFF',\n        bd: on ? '#0F5F8C' : '#B8C4CD',\n        fg: '#14212B',\n        sub: on ? '#0B4E73' : '#4A5B68',\n        toggle: () => {\n          const sel = Object.assign({}, this.st().sel);\n          sel[x.id] = !sel[x.id];\n          this.setState({ sel: sel });\n        }\n      };\n    });\n\n    const chapGroups = selected\n      .filter((x) => Object.keys(names[x.id] || {}).length > 1)\n      .map((x) => {\n        const cmap = names[x.id];\n        const keys = Object.keys(cmap);\n        return {\n          name: x.name,\n          all: () => {\n            const off = Object.assign({}, this.st().chapOff);\n            keys.forEach((k) => { delete off[x.id + ':' + k]; });\n            this.setState({ chapOff: off });\n          },\n          none: () => {\n            const off = Object.assign({}, this.st().chapOff);\n            keys.forEach((k) => { off[x.id + ':' + k] = true; });\n            this.setState({ chapOff: off });\n          },\n          chaps: keys.map((k) => {\n            const key = x.id + ':' + k;\n            const on = !s.chapOff[key];\n            const cnt = bank.filter((d) => d.s === x.id && String(d.cn) === k).length;\n            return {\n              label: 'Chương ' + k + ': ' + cmap[k] + ' (' + cnt + ')',\n              on: on,\n              bg: on ? '#E1EFF6' : '#FFFFFF',\n              bd: on ? '#0F5F8C' : '#B8C4CD',\n              fg: on ? '#0B3A55' : '#3E4F5C',\n              toggle: () => {\n                const off = Object.assign({}, this.st().chapOff);\n                if (off[key]) delete off[key]; else off[key] = true;\n                this.setState({ chapOff: off });\n              }\n            };\n          })\n        };\n      });\n\n    const counts = [10, 20, 30, 50, 9999].map((c) => {\n      const on = s.count === c;\n      return {\n        label: c === 9999 ? 'Tất cả' : String(c),\n        on: on,\n        bg: on ? '#0F5F8C' : '#FFFFFF',\n        bd: on ? '#0F5F8C' : '#B8C4CD',\n        fg: on ? '#FFFFFF' : '#14212B',\n        pick: () => this.setState({ count: c })\n      };\n    });\n\n    const canStart = avail.length > 0;\n    const summary = canStart\n      ? 'Sẽ bốc ngẫu nhiên ' + n + ' câu trong ' + avail.length + ' câu đã chọn.'\n      : 'Hãy chọn ít nhất một môn và một chương.';\n\n    // ----- quiz -----\n    let quiz = { num: 0, total: 0, right: 0, progress: '0%', subject: '', where: '', question: '', hasCode: false, code: '', hasImg: false, img: '', showMultiHint: false, multiHint: '', options: [], showCheck: false, checkBg: '#B8C4CD', checkFg: '#14212B', answered: false, verdict: '', hasExplain: false, explain: '', hasNote: false, note: '', fbBg: '#FFFFFF', fbBd: '#FFFFFF', fbFg: '#14212B', nextLabel: '' };\n    if (s.screen === 'quiz' && s.qs.length) {\n      const item = s.qs[s.idx];\n      const d = item.d;\n      const multi = this.isMulti(d);\n      const answered = s.checked;\n      const right = s.log.filter((l) => l.ok).length;\n      const lastOk = answered && s.log.length ? s.log[s.log.length - 1].ok : false;\n      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];\n      quiz = {\n        num: s.idx + 1,\n        total: s.qs.length,\n        right: right,\n        progress: Math.round(((s.idx + (answered ? 1 : 0)) / s.qs.length) * 100) + '%',\n        subject: this.subName(d.s),\n        where: this.whereLabel(d),\n        question: d.q,\n        hasCode: !!d.k,\n        code: d.k || '',\n        hasImg: !!d.g,\n        img: d.g || '',\n        showMultiHint: multi && !answered,\n        multiHint: 'Câu này có ' + d.a.length + ' đáp án đúng. Chọn đủ rồi bấm Kiểm tra.',\n        showCheck: multi && !answered,\n        checkBg: s.picks.length ? '#0F5F8C' : '#B8C4CD',\n        checkFg: s.picks.length ? '#FFFFFF' : '#14212B',\n        answered: answered,\n        verdict: lastOk ? 'Chính xác!' : 'Chưa đúng.',\n        hasExplain: !!d.e,\n        explain: d.e || '',\n        hasNote: !!d.n,\n        note: d.n || '',\n        fbBg: lastOk ? '#E3F4EA' : '#FBE6E4',\n        fbBd: lastOk ? '#1E7A46' : '#B3261E',\n        fbFg: lastOk ? '#124D2C' : '#7A1712',\n        nextLabel: s.idx + 1 >= s.qs.length ? 'Xem kết quả' : 'Câu tiếp theo',\n        options: item.ord.map((oi, pos) => {\n          const picked = s.picks.indexOf(oi) >= 0;\n          const isAns = d.a.indexOf(oi) >= 0;\n          const isAlt = !multi && (d.l || []).indexOf(oi) >= 0;\n          let bg = '#FFFFFF', bd = '#B8C4CD', fg = '#14212B', bb = '#E8EDF1', bf = '#14212B', tag = '';\n          if (!answered && picked) { bg = '#E1EFF6'; bd = '#0F5F8C'; fg = '#0B3A55'; bb = '#0F5F8C'; bf = '#FFFFFF'; }\n          if (answered) {\n            if (isAns) { bg = '#E3F4EA'; bd = '#1E7A46'; fg = '#124D2C'; bb = '#1E7A46'; bf = '#FFFFFF'; tag = 'Đáp án đúng'; }\n            else if (isAlt) { bg = '#EEF7F1'; bd = '#1E7A46'; fg = '#124D2C'; bb = '#1E7A46'; bf = '#FFFFFF'; tag = 'Cũng đúng'; }\n            else if (picked) { bg = '#FBE6E4'; bd = '#B3261E'; fg = '#7A1712'; bb = '#B3261E'; bf = '#FFFFFF'; tag = 'Bạn chọn'; }\n          }\n          return {\n            letter: letters[pos],\n            text: d.o[oi],\n            selected: picked,\n            bg: bg, bd: bd, fg: fg, badgeBg: bb, badgeFg: bf,\n            tag: tag,\n            hasTag: tag !== '',\n            pick: () => {\n              const cur = this.st();\n              if (cur.checked) return;\n              const dd = cur.qs[cur.idx].d;\n              if (this.isMulti(dd)) {\n                const p = cur.picks.slice();\n                const at = p.indexOf(oi);\n                if (at >= 0) p.splice(at, 1); else p.push(oi);\n                this.setState({ picks: p });\n              } else {\n                const ok = this.grade(dd, [oi]);\n                this.setState({ picks: [oi], checked: true, log: cur.log.concat([{ qi: cur.idx, picks: [oi], ok: ok }]) });\n              }\n            }\n          };\n        })\n      };\n    }\n\n    // ----- result -----\n    let result = { score: 0, total: 0, pct: 0, verdict: '', bySub: [], hasWrong: false, wrongCount: 0, wrongs: [] };\n    if (s.screen === 'result') {\n      const total = s.qs.length;\n      const score = s.log.filter((l) => l.ok).length;\n      const pct = total ? Math.round((score / total) * 100) : 0;\n      const by = {};\n      s.log.forEach((l) => {\n        const d = s.qs[l.qi].d;\n        by[d.s] = by[d.s] || { right: 0, total: 0 };\n        by[d.s].total += 1;\n        if (l.ok) by[d.s].right += 1;\n      });\n      const wrongLog = s.log.filter((l) => !l.ok);\n      result = {\n        score: score,\n        total: total,\n        pct: pct,\n        verdict: pct >= 80 ? 'Rất tốt, gần như nắm chắc rồi!' : pct >= 50 ? 'Khá ổn. Xem lại các câu sai bên dưới.' : 'Cần ôn thêm. Làm lại các câu sai nhé.',\n        bySub: Object.keys(by).map((k) => ({\n          name: this.subName(k),\n          right: by[k].right,\n          total: by[k].total,\n          w: Math.round((by[k].right / by[k].total) * 100) + '%'\n        })),\n        hasWrong: wrongLog.length > 0,\n        wrongCount: wrongLog.length,\n        wrongs: wrongLog.map((l) => {\n          const d = s.qs[l.qi].d;\n          const multi = this.isMulti(d);\n          const rightIdx = multi ? d.a : d.a.concat(d.l || []);\n          return {\n            where: this.subName(d.s) + ' · ' + this.whereLabel(d),\n            question: d.q,\n            hasCode: !!d.k,\n            code: d.k || '',\n            yours: l.picks.map((p) => d.o[p]).join('  |  '),\n            right: rightIdx.map((p) => d.o[p]).join(multi ? '  |  ' : '   hoặc   '),\n            hasExplain: !!d.e,\n            explain: d.e || '',\n            hasNote: !!d.n,\n            note: d.n || ''\n          };\n        })\n      };\n    }\n\n    return {\n      isSetup: s.screen === 'setup',\n      isQuiz: s.screen === 'quiz',\n      isResult: s.screen === 'result',\n      bankMissing: bank.length === 0,\n      subjects: subjects,\n      hasChapGroups: chapGroups.length > 0,\n      chapGroups: chapGroups,\n      countHeading: (chapGroups.length > 0 ? '3' : '2') + '. Số câu mỗi lượt',\n      counts: counts,\n      shuffleOn: s.shuf,\n      shuffleLabel: s.shuf ? 'Xáo trộn thứ tự đáp án: Bật' : 'Xáo trộn thứ tự đáp án: Tắt (đáp án đúng luôn ở A)',\n      toggleShuffle: () => this.setState({ shuf: !this.st().shuf }),\n      summary: summary,\n      footNote: 'Ngân hàng hiện có ' + bank.length + ' câu: Mạng máy tính, Linux và OOP lấy từ file ngân hàng đề của bạn (đã loại câu trùng); SQL Server và Python soạn từ ghi chú. Các câu hỏi có đáp án nghi sai sẽ hiện ghi chú sau khi trả lời. Khi bật xáo trộn, câu có chữ \"Cả 3 ý trên...\" giữ nguyên thứ tự. Khi tắt, đáp án đúng được đưa lên A (trừ câu có đáp án nhắc tới chữ cái như \"A và B đều đúng\").',\n      startBg: canStart ? '#0F5F8C' : '#B8C4CD',\n      startFg: canStart ? '#FFFFFF' : '#14212B',\n      start: () => {\n        const cur = this.st();\n        const pool = this.pool(cur);\n        if (!pool.length) return;\n        this.begin(this.shuffle(pool).slice(0, Math.min(cur.count, pool.length)));\n      },\n      quiz: quiz,\n      check: () => {\n        const cur = this.st();\n        if (cur.checked || !cur.picks.length) return;\n        const d = cur.qs[cur.idx].d;\n        this.setState({ checked: true, log: cur.log.concat([{ qi: cur.idx, picks: cur.picks.slice(), ok: this.grade(d, cur.picks) }]) });\n      },\n      next: () => {\n        const cur = this.st();\n        if (!cur.checked) return;\n        if (cur.idx + 1 >= cur.qs.length) this.setState({ screen: 'result' });\n        else this.setState({ idx: cur.idx + 1, picks: [], checked: false });\n      },\n      quit: () => this.setState({ screen: 'setup', qs: [], idx: 0, picks: [], checked: false, log: [] }),\n      result: result,\n      retryWrong: () => {\n        const cur = this.st();\n        const items = cur.log.filter((l) => !l.ok).map((l) => cur.qs[l.qi].d);\n        if (items.length) this.begin(this.shuffle(items));\n      },\n      again: () => {\n        const cur = this.st();\n        const pool = this.pool(cur);\n        if (!pool.length) { this.setState({ screen: 'setup' }); return; }\n        this.begin(this.shuffle(pool).slice(0, Math.min(cur.count, pool.length)));\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
